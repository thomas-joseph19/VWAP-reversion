[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vwap-revert"
version = "0.1.0"
description = "Phase 1 data pipeline foundation for the VWAP reversion backtester."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "polars>=1.39.3,<1.40",
  "pyarrow>=23.0.1,<24",
  "numpy>=2.4.4,<3",
  "tzdata>=2025.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.2,<10",
  "ruff>=0.13,<0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

